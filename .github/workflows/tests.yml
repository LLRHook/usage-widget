name: Offline regression tests

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Hosted runners provide Rust and a native linker. No desktop packages,
      # usage records, account credentials, or startup installation are needed.
      - name: Check native formatting
        run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - name: Test native protocol
        run: cargo test --locked --manifest-path native/Cargo.toml
      - name: Lint native core
        run: cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - name: Build and stage native collector
        run: python build_native.py
      - name: Run regression and host-native integration tests
        run: python -m unittest discover -v
      - name: Compile application modules
        run: python -m py_compile widget.py widget_native.py tray.py probe_claude.py usage_core.py build_native.py
