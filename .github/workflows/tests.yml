name: Offline regression tests

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # GUI, HTTP, subprocess, and credential seams are mocked by the tests.
      # Desktop requirements are unnecessary for this standard-library suite.
      - name: Run regression tests
        run: python -m unittest discover -v
      - name: Compile application modules
        run: python -m py_compile widget.py widget_native.py tray.py probe_claude.py
